<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMNI AI Story Creator - Fixed</title>
  <style>
    :root { --primary: #00f2fe; --secondary: #4facfe; --bg-color: #0b0f19; --card-bg: rgba(20, 25, 40, 0.8); }
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0b0f19; color: white; display: flex; justify-content: center; padding: 20px; }
    .container { max-width: 700px; width: 100%; background: rgba(20,25,40,0.85); padding: 30px; border-radius: 16px; }
    textarea, button { width: 100%; border-radius: 10px; }
    textarea { height: 120px; padding: 15px; margin-bottom: 15px; background: #111827; color: white; border: 1px solid #334155; }
    button { padding: 14px; border: none; background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
    .output-section { margin-top: 20px; display: none; }
    .result-box { background: rgba(0,0,0,0.35); padding: 16px; border-radius: 10px; margin-bottom: 15px; }
    img, video, audio { width: 100%; margin-top: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>OMNI AI Engine</h1>
    <p>Working Offline Version ✅</p>

    <textarea id="promptInput" placeholder="Enter your story idea..."></textarea>
    <button onclick="generateRealMagic()">Generate Story & Media</button>

    <div class="output-section" id="outputArea">
      <div class="result-box">
        <h3>📖 Story</h3>
        <div id="storyOutput"></div>
      </div>
      <div class="result-box">
        <h3>🎨 Illustration</h3>
        <img id="imageOutput" src="" alt="Story Image">
      </div>
      <div class="result-box">
        <h3>🎧 Voice</h3>
        <audio id="audioOutput" controls></audio>
      </div>
      <div class="result-box">
        <h3>🎬 Scene Video</h3>
        <video id="videoOutput" controls autoplay muted loop>
          <source id="videoSource" src="videos/default.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <script>
    function generateRealMagic() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        alert('Please enter a prompt first!');
        return;
      }

      const storyText = `Once upon a time, ${prompt}, and it became an exciting magical adventure full of mystery and action.`;
      document.getElementById('storyOutput').innerText = storyText;

      const img = document.getElementById('imageOutput');
      const videoSource = document.getElementById('videoSource');
      const video = document.getElementById('videoOutput');
      const lower = prompt.toLowerCase();

      if (lower.includes('jungle') || lower.includes('forest')) {
        img.src = 'images/jungle.jpg';
        videoSource.src = 'videos/jungle.mp4';
      } else if (lower.includes('space') || lower.includes('moon')) {
        img.src = 'images/space.jpg';
        videoSource.src = 'videos/space.mp4';
      } else if (lower.includes('ocean') || lower.includes('sea')) {
        img.src = 'images/ocean.jpg';
        videoSource.src = 'videos/ocean.mp4';
      } else {
        img.src = 'images/default.jpg';
        videoSource.src = 'videos/default.mp4';
      }

      video.load();

      const voice = new SpeechSynthesisUtterance(storyText);
      speechSynthesis.cancel();
      speechSynthesis.speak(voice);

      document.getElementById('outputArea').style.display = 'block';
    }
  </script>
</body>
</html>
