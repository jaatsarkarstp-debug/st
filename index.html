<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Generator by JAAT</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 5px;
        }
        .header-credentials {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 25px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #00d2ff;
        }
        button {
            background: linear-gradient(135deg, #00d2ff, #007bff);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.8;
        }
        #loading {
            display: none;
            margin-top: 20px;
            color: #00d2ff;
            font-style: italic;
        }
        .output-section {
            display: none;
            margin-top: 30px;
            text-align: left;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        .output-section h3 {
            margin-top: 0;
            color: #00d2ff;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .story-text {
            line-height: 1.6;
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Story Creator</h1>
        <div class="header-credentials">Project by JAAT | Narayana E Techno School, Ajmer</div>

        <textarea id="promptInput" placeholder="Apni story ka idea yahan likhiye... (Example: Ek time-traveling robot jo dinosaur era mein chala gaya)"></textarea>
        
        <button onclick="simulateGeneration()">Generate Magic</button>

        <div id="loading">Generating your story, illustration, and audio... Please wait.</div>

        <div class="output-section" id="outputArea">
            <h3>📖 The Story:</h3>
            <div class="story-text" id="storyOutput"></div>

            <h3>🎨 Illustration:</h3>
            <img id="imageOutput" src="" alt="Story Illustration">

            <h3>🎧 Narration:</h3>
            <audio id="audioOutput" controls></audio>
        </div>
    </div>

    <script>
        function simulateGeneration() {
            const prompt = document.getElementById("promptInput").value;
            
            if (prompt.trim() === "") {
                alert("Bhai, pehle text box mein koi prompt toh daalo!");
                return;
            }

            // UI changes: Show loading, hide previous output
            document.getElementById("loading").style.display = "block";
            document.getElementById("outputArea").style.display = "none";

            // Jab aap asali API lagayenge, toh yeh setTimeout remove karke API call yahan likhenge
            setTimeout(() => {
                // UI changes: Hide loading, show output
                document.getElementById("loading").style.display = "none";
                document.getElementById("outputArea").style.display = "block";

                // Dummy data fill kar rahe hain frontend check karne ke liye
                document.getElementById("storyOutput").innerText = "Yeh aapki story ka text hai based on: '" + prompt + "'. Future mein yahan AI generated kahani aayegi.";
                
                // Placeholder image from internet
                document.getElementById("imageOutput").src = "https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
                
            }, 2500); // 2.5 seconds ka fake loading time
        }
    </script>

</body>
</html>
